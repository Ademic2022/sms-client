name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Generated GraphQL types match schema.graphql
        run: npx graphql-codegen && git diff --exit-code src/gql
      - run: npm run build

  # The browser tests start the real API, so they need the server repository. It is private
  # and in another account (AdemicOrg), so they need a SERVER_REPO_TOKEN secret: a
  # fine-grained personal access token with read-only Contents access to
  # AdemicOrg/akademiq-server. Without it the browser tests are skipped, not failed.
  server-access:
    runs-on: ubuntu-latest
    outputs:
      ok: ${{ steps.check.outputs.ok }}
    steps:
      - id: check
        env:
          TOKEN: ${{ secrets.SERVER_REPO_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Browser tests skipped: add a SERVER_REPO_TOKEN secret (read access to AdemicOrg/akademiq-server) to run them."
          fi

  browser-tests:
    needs: server-access
    if: needs.server-access.outputs.ok == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: sms-client
      - uses: actions/checkout@v4
        with:
          repository: AdemicOrg/akademiq-server
          path: akademiq-server
          token: ${{ secrets.SERVER_REPO_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sms-client/package-lock.json
      - uses: astral-sh/setup-uv@v5
      - name: PDF libraries for report cards
        run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0
      - run: uv sync --frozen
        working-directory: akademiq-server
      - run: npm ci
        working-directory: sms-client
      - name: Client and server agree on the API
        run: diff akademiq-server/schema.graphql sms-client/schema.graphql
      - run: npx playwright install --with-deps chromium
        working-directory: sms-client
      - run: npm run e2e
        working-directory: sms-client
        env:
          PLAYWRIGHT_CHANNEL: chromium
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: sms-client/playwright-report
