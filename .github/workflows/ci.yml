name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Generated GraphQL types match schema.graphql
        run: npx graphql-codegen && git diff --exit-code src/gql
      - run: npm run build

  browser-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: sms-client
      # The tests start the real API, so the server repository sits next to this one.
      # If it is private, add a SERVER_REPO_TOKEN secret with read access to it.
      - uses: actions/checkout@v4
        with:
          repository: Ademic2022/sms-server
          path: sms-server
          token: ${{ secrets.SERVER_REPO_TOKEN || github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sms-client/package-lock.json
      - uses: astral-sh/setup-uv@v5
      - name: PDF libraries for report cards
        run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0
      - run: uv sync --frozen
        working-directory: sms-server
      - run: npm ci
        working-directory: sms-client
      - name: Client and server agree on the API
        run: diff sms-server/schema.graphql sms-client/schema.graphql
      - run: npx playwright install --with-deps chromium
        working-directory: sms-client
      - run: npm run e2e
        working-directory: sms-client
        env:
          PLAYWRIGHT_CHANNEL: chromium
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: sms-client/playwright-report
