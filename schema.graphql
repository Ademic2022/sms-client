type Mutation {
  """Log in by phone number or email address."""
  login(identifier: String!, password: String!): Me!
  logout: Boolean!

  """Send a reset code by SMS (or email when there is no phone)."""
  requestPasswordReset(identifier: String!): Boolean!
  resetPassword(identifier: String!, code: String!, newPassword: String!): Boolean!
  changePassword(currentPassword: String!, newPassword: String!): Boolean!

  """Create a new school with its own web address."""
  signUpSchool(name: String!, slug: String!, adminFirstName: String!, adminLastName: String!, adminPhone: String!, password: String!, sections: [String!]!, acceptDataProcessingAgreement: Boolean!, adminEmail: String = null): SignUpResult!

  """Confirm an email address with the token from the confirmation link."""
  confirmEmail(token: String!): EmailConfirmation!

  """
  Send the confirmation link again. Always succeeds, so it cannot reveal which accounts exist.
  """
  resendEmailConfirmation(identifier: String!): Boolean!
  updateSchoolSettings(name: String = null, motto: String = null, address: String = null, phone: String = null, email: String = null, primaryColor: String = null, secondaryColor: String = null, settingsJson: JSON = null): SchoolSettings!
  saveSession(name: String!, startDate: Date!, endDate: Date!, id: ID = null): SessionType!
  saveTerm(sessionId: ID!, number: Int!, startDate: Date!, endDate: Date!, daysOpened: Int! = 0, nextTermBegins: Date = null, id: ID = null): TermType!
  setCurrentTerm(termId: ID!): TermType!
  saveLevel(name: String!, section: String!, order: Int! = 0, gradingScaleId: ID = null, nextLevelId: ID = null, hasSubjectSelection: Boolean! = false, reportTemplate: String! = "", id: ID = null): LevelType!
  saveArm(levelId: ID!, name: String!, classTeacherId: ID = null, isActive: Boolean! = true, id: ID = null): ArmType!
  saveSubject(name: String!, code: String! = "", id: ID = null): SubjectType!
  setLevelSubjects(levelId: ID!, subjects: [LevelSubjectInput!]!): LevelType!
  setAssessmentComponents(levelId: ID!, components: [ComponentInput!]!): LevelType!
  saveGradingScale(name: String!, bands: [BandInput!]!, id: ID = null): GradingScaleType!
  assignSubjectTeacher(armId: ID!, subjectId: ID!, teacherId: ID!): SubjectAssignmentType!
  addStaff(firstName: String!, lastName: String!, roleCodes: [String!]!, phone: String = null, email: String = null, title: String! = ""): MembershipType!
  setStaffRoles(membershipId: ID!, roleCodes: [String!]!, isActive: Boolean! = true): MembershipType!

  """Create portal logins for every student in a class who has none."""
  createStudentLogins(armId: ID!): [StudentLogin!]!

  """
  A new starting password for one student; creates their login if they have none.
  """
  resetStudentPassword(studentId: ID!): StudentLogin!
  createStudent(data: StudentInput!, guardians: [GuardianInput!]!): StudentType!
  updateStudent(id: ID!, data: StudentInput!): StudentType!
  addGuardian(studentId: ID!, guardian: GuardianInput!): StudentType!
  changeStudentStatus(id: ID!, status: String!, reason: String!): StudentType!
  setStudentSubjects(studentId: ID!, subjectIds: [ID!]!): [SubjectType!]!

  """Promote every class in one go, applying each student's decision."""
  promoteSchool(fromSessionId: ID!, toSessionId: ID!, decisions: [PromotionDecision!]!, passMark: Float = null): PromotionResult!
  promoteClass(armId: ID!, fromSessionId: ID!, toSessionId: ID!, decisions: [PromotionDecision!] = null): PromotionResult!
  markAttendance(armId: ID!, date: Date!, entries: [AttendanceEntry!]!): AttendanceSaveResult!
  saveScores(armId: ID!, subjectId: ID!, termId: ID!, entries: [ScoreEntry!]!): SaveScoresResult!
  saveTraitRatings(armId: ID!, termId: ID!, ratings: [RatingInput!]!): Int!
  saveReportComments(armId: ID!, termId: ID!, comments: [CommentInput!]!): Int!
  approveResults(armId: ID!, termId: ID!): String!
  unlockResults(armId: ID!, termId: ID!, reason: String!): String!
  publishResults(armId: ID!, termId: ID!, publishAt: DateTime = null, notifyParents: Boolean! = true): String!
  generateReportCards(armId: ID!, termId: ID!): Boolean!

  """
  Set or clear what a student owed before the school joined. Negative means paid ahead.
  """
  setOpeningBalance(studentId: ID!, amountKobo: Int, asOf: Date = null, note: String! = ""): OpeningBalanceType
  saveFeeItem(name: String!, order: Int! = 0, id: ID = null): FeeItemType!
  setFeeSchedule(termId: ID!, schedules: [ScheduleInput!]!): [FeeScheduleType!]!
  generateBills(termId: ID!, armId: ID = null): Int!
  addDiscount(studentId: ID!, name: String!, kind: String!, value: Kobo!, itemId: ID = null, termId: ID = null, applyToExistingBill: Boolean! = true): DiscountType!
  addBillItem(billId: ID!, description: String!, amountKobo: Kobo!, itemId: ID = null, reason: String! = ""): BillType!
  removeBillItem(lineId: ID!, reason: String!): BillType!
  recordPayment(studentId: ID!, amountKobo: Kobo!, method: String!, paidAt: DateTime!, reference: String! = "", note: String! = ""): PaymentType!
  reversePayment(paymentId: ID!, reason: String!): PaymentType!
  startCheckout(payFor: [PayFor!]!, callbackUrl: String!, email: String = null): CheckoutResult!
  sendMessage(audience: String!, body: String!, title: String! = "", armId: ID = null, sendSms: Boolean! = true, showInApp: Boolean! = true): MessageType!

  """
  Send a message again to the numbers it failed to reach. Uses SMS units.
  """
  resendFailed(messageId: ID!): MessageType!

  """A parent consents for their children under the current notice."""
  giveConsent(studentIds: [ID!]!): MyConsent!

  """A parent withdraws their consent for one child."""
  withdrawMyConsent(studentId: ID!, reason: String!): MyConsent!

  """Staff record consent a parent gave on the school's paper form."""
  recordPaperConsent(studentId: ID!, guardianId: ID!, givenOn: Date!): Boolean!

  """
  Staff record that a parent withdrew consent, for example by letter or in person.
  """
  recordConsentWithdrawal(consentId: ID!, reason: String!): Boolean!

  """
  Publish a new version of the privacy notice. Every parent is asked to consent again.
  """
  publishPrivacyNotice(body: String!): PrivacyNoticeType!

  """Start paying a subscription invoice online."""
  payInvoice(invoiceId: ID!, returnPath: String!): PaymentStart!

  """Start buying SMS units online."""
  buySmsUnits(units: Int!, returnPath: String!): PaymentStart!

  """Check a payment after returning from the payment page."""
  confirmPlatformPayment(reference: String!): PlatformPaymentResult!

  """
  Platform admins: record an invoice paid by bank transfer or another way.
  """
  markInvoicePaid(invoiceId: ID!, reference: String!, via: String! = "transfer"): InvoiceType!

  """Platform admins: cancel an unpaid invoice raised in error."""
  voidInvoice(invoiceId: ID!, reason: String!): InvoiceType!

  """
  Platform admins: raise any invoices that are due now, instead of waiting for the daily job.
  """
  generateInvoices: [PlatformInvoiceRow!]!
  setSchoolStatus(schoolId: ID!, status: String!, reason: String! = ""): SchoolRow!
  setSenderIdStatus(schoolId: ID!, status: String!): Boolean!
  creditSmsUnits(schoolId: ID!, units: Int!, reason: String!, amountPaidKobo: Int! = 0): Int!
  grantSupportAccess(reason: String!, hours: Int! = 24): SupportGrantType!
  revokeSupportAccess(grantId: ID!): Boolean!

  """The name on a bank account, to check before linking it."""
  resolvePayoutAccount(bankCode: String!, accountNumber: String!): String!

  """Link (or change) the bank account online fee payments are paid into."""
  connectPayoutAccount(bankCode: String!, accountNumber: String!): PayoutAccount!
}

